# mars_relay_earth_scenario_40 -- IPN-D scenario converted for the Contact Plan Designer.
# Source: ipn-d-inputs-json/mars_relay_earth_scenario_40.csv (Jason Gerard's orbit-generator
# output) plus the planet database and time grid from IPN-D's config.json.
# Sections in the CSV: Mars relay constellation, Mars constellation, Earth ground stations.
# 49 orbiters, 9 landers.
# radius-mode=as-run: orbit radius = altitude + 2*R, reproducing what
#   IPN-D actually propagated (see convert_ipnd_csv.py docstring).
# Generated by convert_ipnd_csv.py -- edit that, not this file.
name: mars-relay-earth-scenario-40
epoch-s: 725803264.184          # IPN-D SimulationStartTime (J2000 s)
# No propagation-epoch-s: every element below is already stated AT that epoch.
# (Keeps the 3D view's globe aligned with its landers -- see the header.)
duration-s: 21600.0           # SHORTENED from IPN-D's 86400 s for a lighter render
step-s: 600.0                   # IPN-D Step; `cpd compute --no-refine` keeps this grid

bodies:
  - name: Earth
    parent: Sun
    mu-km3-s2: 398600.4418
    radius-km: 6371
    rotation-period-h: 23.76            # IPN-D RotationPeriod 0.99 d; prograde
    prime-meridian-deg: 342.5429           # spin phase AT the epoch (epoch baked in, see header)
    obliquity-deg: 0.0                 # IPN-D config says 23.44; CPD applies no obliquity to geometry
    elements: { sma-km: 149600000, eccentricity: 0.0167, inclination-deg: 0.0,
                raan-deg: 0.0, arg-periapsis-deg: 102.9, mean-anomaly-deg: 99.887160,   # J2000 value 100.46435, advanced to the epoch
                orbit-period-s: 31558863.596656322 }
  - name: Mars
    parent: Sun
    mu-km3-s2: 42828.375214
    radius-km: 3389.5
    rotation-period-h: 24.72            # IPN-D RotationPeriod 1.03 d; prograde
    prime-meridian-deg: 297.3470           # spin phase AT the epoch (epoch baked in, see header)
    obliquity-deg: 0.0                 # IPN-D config says 25.19; CPD applies no obliquity to geometry
    elements: { sma-km: 227936640, eccentricity: 0.093405, inclination-deg: 1.849,
                raan-deg: 49.558, arg-periapsis-deg: 286.502, mean-anomaly-deg: 101.621825,   # J2000 value 19.356, advanced to the epoch
